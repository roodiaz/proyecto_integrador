# ======================================
# ANCHORS
# ======================================
x-common-environment: &common-environment

  ASPNETCORE_ENVIRONMENT: Development

  # ===============================
  # POSTGRES
  # ===============================
  ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}

  # ===============================
  # MONGO
  # ===============================
  Mongo__ConnectionString: mongodb://mongo:27017
  Mongo__Database: ${Mongo__Database}

  # ===============================
  # REDIS
  # ===============================
  Redis__ConnectionString: redis:6379
  MarketPriceRefresh__IntervalSeconds: ${MarketPriceRefresh__IntervalSeconds}

  # ===============================
  # JWT
  # ===============================
  Jwt__SecretKey: ${Jwt__SecretKey}
  Jwt__Issuer: ${Jwt__Issuer}
  Jwt__Audience: ${Jwt__Audience}

  # ===============================
  # MARKET DATA PROVIDERS
  # ===============================
  MarketData__DefaultProvider: ${MarketData__DefaultProvider}
  MarketData__Providers__Yahoo__Enabled: ${MarketData__Providers__Yahoo__Enabled}
  MarketData__Providers__Yahoo__BaseUrl: ${MarketData__Providers__Yahoo__BaseUrl}
  MarketData__Providers__EodHistoricalData__Enabled: ${MarketData__Providers__EodHistoricalData__Enabled}
  MarketData__Providers__EodHistoricalData__BaseUrl: ${MarketData__Providers__EodHistoricalData__BaseUrl}
  MarketData__Providers__EodHistoricalData__ApiKey: ${MarketData__Providers__EodHistoricalData__ApiKey}

  # ===============================
  # EMAIL
  # ===============================
  Email__Provider: ${Email__Provider}
  Email__Gmail__Host: ${Email__Gmail__Host}
  Email__Gmail__Port: ${Email__Gmail__Port}
  Email__Gmail__Username: ${Email__Gmail__Username}
  Email__Gmail__Password: ${Email__Gmail__Password}
  Email__Resend__ApiKey: ${Email__Resend__ApiKey}
  Email__Resend__From: ${Email__Resend__From}

x-common-service: &common-service
  restart: always

  depends_on:
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

  networks:
    - investlab-network

services:

  # ======================================
  # API
  # ======================================
  investlab.api:
    <<: *common-service

    image: ${DOCKER_REGISTRY-}investlabapi

    build:
      context: .
      dockerfile: InvestLab.Api/Dockerfile

    container_name: investlab.api

    ports:
      - "8080:8080"

    environment:
      <<: *common-environment

      # ===============================
      # LIMITS
      # ===============================
      Limits__MaxAlerts: ${Limits__MaxAlerts}
      Limits__MaxFavorites: ${Limits__MaxFavorites}
      Limits__MaxOperationsPerDay: ${Limits__MaxOperationsPerDay}
      Limits__MaxDailySearches: ${Limits__MaxDailySearches}
      Limits__InitialBalance: ${Limits__InitialBalance}

  # ======================================
  # WORKERS
  # ======================================
  investlab.workers:
    <<: *common-service

    image: ${DOCKER_REGISTRY-}investlabworkers

    build:
      context: .
      dockerfile: InvestLab.Workers/Dockerfile

    container_name: investlab.workers

    environment:
      <<: *common-environment

  # ======================================
  # FRONTEND
  # ======================================
  investlab.frontend:
    image: ${DOCKER_REGISTRY-}investlabfrontend

    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        API_URL: /api
        SERVER_URL: ""

    container_name: investlab.frontend

    restart: always

    depends_on:
      - investlab.api

    ports:
      - "4200:80"

    networks:
      - investlab-network

  # ======================================
  # POSTGRES
  # ======================================
  postgres:
    image: postgres:17

    container_name: investlab.postgres

    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - investlab-network

  # ======================================
  # MONGO
  # ======================================
  mongo:
    image: mongo:8

    container_name: investlab.mongo

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - investlab-network

  # ======================================
  # REDIS
  # ======================================
  redis:
    image: redis:7-alpine

    container_name: investlab.redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - investlab-network

# ======================================
# NETWORKS
# ======================================
networks:
  investlab-network:
    driver: bridge

# ======================================
# VOLUMES
# ======================================
volumes:
  postgres_data:
  mongo_data:
  redis_data:
