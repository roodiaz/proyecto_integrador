<div class="watchlist-container">
  <div class="watchlist-header">
    <h2>Lista de Seguimiento</h2>
    <div class="add-symbol">
      <input 
        type="text" 
        placeholder="Agregar ticker..." 
        [(ngModel)]="newTicker"
        (keyup.enter)="addToWatchlist()"
        class="ticker-input"
      >
      <button (click)="addToWatchlist()" class="add-btn">Agregar</button>
    </div>
  </div>

  <div class="watchlist-table-container">
    <table class="watchlist-table">
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Precio Actual</th>
          <th>Variación %</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of watchlistItems" [class.positive]="item.isPositive" [class.negative]="!item.isPositive">
          <td class="ticker-cell">{{ item.ticker }}</td>
          <td class="price-cell">${{ item.currentPrice.toFixed(2) }}</td>
          <td class="variation-cell" [class.positive]="item.isPositive" [class.negative]="!item.isPositive">
            {{ item.isPositive ? '+' : '' }}{{ item.variationPercent.toFixed(2) }}%
          </td>
          <td class="actions-cell">
            <button (click)="removeFromWatchlist(item.ticker)" class="remove-btn">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
    
    <div *ngIf="watchlistItems.length === 0" class="empty-state">
      <p>No tienes tickers en tu lista de seguimiento</p>
      <p>Agrega un ticker para comenzar a seguir su precio</p>
    </div>
  </div>
</div>
