<mat-sidenav #sidenav mode="side" [opened]="true" class="sidenav" [ngClass]="{'collapsed': isCollapsed}">

  <div class="sidenav-header" (click)="toggleSidebar()" style="cursor: pointer;">
    <img [src]="isCollapsed ? '../img/logo.png' : '../img/logo_name_v2.png'" alt="Invest Lab" class="logo">
  </div>

  <mat-nav-list>
    <a mat-list-item routerLink="/dashboard" routerLinkActive="active" matTooltip="Dashboard" [matTooltipDisabled]="!isCollapsed">
      <mat-icon>dashboard</mat-icon>
      <span class="menu-text">Dashboard</span>
    </a>

    <a mat-list-item routerLink="/market" routerLinkActive="active" matTooltip="Mercado" [matTooltipDisabled]="!isCollapsed">
      <mat-icon>trending_up</mat-icon>
      <span class="menu-text">Mercado</span>
    </a>

    <a mat-list-item routerLink="/portfolio" routerLinkActive="active" matTooltip="Mi Portafolio" [matTooltipDisabled]="!isCollapsed">
      <mat-icon>account_balance_wallet</mat-icon>
      <span class="menu-text">Mi Portafolio</span>
    </a>

    <a mat-list-item routerLink="/alerts" routerLinkActive="active" matTooltip="Alertas" [matTooltipDisabled]="!isCollapsed">
      <mat-icon>notifications</mat-icon>
      <span class="menu-text">Alertas</span>
    </a>

    <a mat-list-item routerLink="/watchlist" routerLinkActive="active" matTooltip="Lista de Seguimiento" [matTooltipDisabled]="!isCollapsed">
      <mat-icon>star</mat-icon>
      <span class="menu-text">Lista de Seguimiento</span>
    </a>
  </mat-nav-list>

  <!-- Fuera del mat-nav-list para que el flex del .sidenav lo empuje al fondo -->
  <div class="bottom-section">
    <mat-divider></mat-divider>
    <mat-nav-list>
      <a mat-list-item routerLink="/profile" routerLinkActive="active" matTooltip="Configuración" [matTooltipDisabled]="!isCollapsed">
        <mat-icon>settings</mat-icon>
        <span class="menu-text">Configuración</span>
      </a>

      <a mat-list-item (click)="logout()" matTooltip="Cerrar Sesión" [matTooltipDisabled]="!isCollapsed">
        <mat-icon>logout</mat-icon>
        <span class="menu-text">Cerrar Sesión</span>
      </a>
    </mat-nav-list>
  </div>

</mat-sidenav>
