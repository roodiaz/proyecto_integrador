<div class="contact-container">
    <mat-card class="contact-card">
      <mat-card-header class="card-header">
        <mat-card-title class="contact-title">
    <!-- <div class="title-line">CONTACTATE</div>
    <div class="title-line">CON NOSOTROS</div> -->
  </mat-card-title>
        <mat-card-subtitle class="contact-subtitle">Envianos tu consulta</mat-card-subtitle>
      </mat-card-header>
  
      <mat-card-content>
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
  
            <!-- Nombre Completo -->
            <div class="field-container">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nombre Completo</mat-label>
                <input matInput 
                      formControlName="fullName" 
                      placeholder="Ej: Juan Pérez"
                      autocomplete="name"
                      style="color: white !important; -webkit-text-fill-color: white !important;">
                <mat-icon matSuffix>person</mat-icon>
                <mat-error *ngIf="fullName?.hasError('required')">
                  El nombre es requerido
                </mat-error>
              </mat-form-field>
            </div>
  
            <!-- Email Field -->
            <div class="field-container">
                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Correo Electrónico</mat-label>
                  <input matInput 
                        type="email" 
                        formControlName="email" 
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        style="color: white !important; -webkit-text-fill-color: white !important;">
                  <mat-icon matSuffix>email</mat-icon>
                  <mat-error *ngIf="email?.hasError('required')">
                    El correo es requerido
                  </mat-error>
                  <mat-error *ngIf="email?.hasError('email')">
                    Por favor ingresa un correo válido
                  </mat-error>
                </mat-form-field>
            </div>
  
            <!-- Telefono Field -->
            <div class="field-container">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Telefono</mat-label>
                <input matInput 
                      type="text"
                      formControlName="phone"
                      autocomplete="phone"
                      style="color: white !important; -webkit-text-fill-color: white !important;">
                <mat-icon matSuffix>phone</mat-icon>
                <mat-error *ngIf="phone?.hasError('required')">
                  El telefono es requerido
                </mat-error>
                <mat-error *ngIf="phone?.hasError('minlength')">
                  Minimo 6 caracteres
                </mat-error>
              </mat-form-field>
            </div>

              <!-- Consulta Field -->
            <div class="field-container">
              <mat-form-field appearance="outline" class="full-width consulta-field">
                <mat-label>Escribe tu consulta</mat-label>
                <textarea matInput 
                        formControlName="consulta"
                        cdkTextareaAutosize
                        cdkAutosizeMinRows="5"
                        cdkAutosizeMaxRows="12"
                        style="color: white !important; -webkit-text-fill-color: white !important; min-height: 120px; resize: vertical;">
                </textarea>
                <mat-error *ngIf="consulta?.hasError('required')">
                  Por favor completa la consulta
                </mat-error>
              </mat-form-field>
            </div>      
  
          <!-- Submit Button -->
          <button mat-raised-button 
                  color="primary" 
                  type="submit" 
                  class="contact-button"
                  [disabled]="!contactForm.valid">
            Enviar
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
