<div class="login-container">
  <mat-card class="login-card">
    <!-- <mat-card-header class="card-header">
      <mat-card-title class="login-title">
      <div class="title-line">INICIAR</div>
      <div class="title-line">SESIÓN</div>
    </mat-card-title>
      <mat-card-subtitle>Ingresa tus credenciales para continuar</mat-card-subtitle>
    </mat-card-header> -->

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Email Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo Electrónico</mat-label>
          <input matInput 
                 type="email" 
                 formControlName="email" 
                 placeholder="ejemplo@correo.com"
                 autocomplete="email"
                 style="color: white !important; -webkit-text-fill-color: white !important;">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="email?.hasError('required')">
            El correo electrónico es requerido
          </mat-error>
          <mat-error *ngIf="email?.hasError('email')">
            Por favor ingresa un correo válido
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <div class="password-field-container">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <input matInput 
                  [type]="hidePassword ? 'password' : 'text'" 
                  formControlName="password"
                  autocomplete="current-password"
                  style="color: white !important; -webkit-text-fill-color: white !important;">
            <button type="button" 
                    mat-icon-button 
                    matSuffix 
                    (click)="hidePassword = !hidePassword" 
                    [attr.aria-label]="'Ocultar contraseña'"
                    [attr.aria-pressed]="hidePassword">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="password?.hasError('required')">
              La contraseña es requerida
            </mat-error>
            <mat-error *ngIf="password?.hasError('minlength')">
              Minimo 6 caracteres
            </mat-error>
          </mat-form-field>
          <div class="forgot-password-container">
            <a routerLink="/recuperar-contrasena" class="forgot-password">
              ¿Olvidaste tu contraseña?
            </a>
          </div>
        </div>

        <!-- Remember me -->
        <mat-checkbox style="color: #B6B6B6 !important;">
          <span style="color: #B6B6B6 !important;">Recordarme</span>
        </mat-checkbox>

        <!-- Submit Button -->
        <button mat-raised-button 
                color="primary" 
                type="submit" 
                class="login-button"
                [disabled]="!loginForm.valid">
          Iniciar Sesión
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
