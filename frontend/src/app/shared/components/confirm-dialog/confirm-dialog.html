<div class="modal-container">
  <div class="modal-header">
    <h2>{{ data.title }}</h2>
    <button class="close-btn" type="button" (click)="onCancel()">✕</button>
  </div>

  <div class="modal-body">
    <p class="dialog-message">{{ data.message }}</p>
  </div>

  <div class="modal-footer">
    <button class="cancel-btn" type="button" (click)="onCancel()">
      {{ data.cancelText || ('SHARED.CONFIRM_DIALOG.CANCEL_BUTTON' | translate) }}
    </button>

    <button class="confirm-btn" type="button" [class.danger]="data.danger" (click)="onConfirm()">
      {{ data.confirmText || ('SHARED.CONFIRM_DIALOG.CONFIRM_BUTTON' | translate) }}
    </button>
  </div>
</div>
