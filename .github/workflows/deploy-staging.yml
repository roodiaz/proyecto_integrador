name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: [self-hosted, staging, investlab]

    steps:
      - name: Actualizar código
        run: |
          cd ~/apps/proyecto_integrador
          git fetch origin
          git checkout staging
          git pull origin staging

      - name: Deploy Docker
        run: |
          cd ~/apps/proyecto_integrador/backend
          docker compose -f docker-compose.yml up -d --build

      - name: Limpiar imágenes viejas
        run: |
          docker image prune -f
