<div class="modal-container">
  <div class="modal-header">
    <h2>{{ 'PORTFOLIO.SELL_PROMPT.TITLE' | translate }}</h2>
    <button class="close-btn" type="button" (click)="onCancel()">✕</button>
  </div>

  <div class="modal-body">
    <p class="dialog-subtitle">{{ 'PORTFOLIO.SELL_PROMPT.SUBTITLE' | translate }}</p>

    <div class="field-group">
      <label class="field-label">{{ 'PORTFOLIO.MODAL.TICKER_LABEL' | translate }}</label>

      <div class="ticker-search">
        <input
          class="field-input"
          type="text"
          [(ngModel)]="ticker"
          (keyup.enter)="onContinue()"
          [placeholder]="'MARKET.SEARCH_SYMBOL_PLACEHOLDER' | translate"
          autocomplete="off"
        />

        <button type="button" class="search-btn" [disabled]="!ticker.trim()" (click)="onContinue()">
          <mat-icon class="search-icon">search</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button class="cancel-btn" type="button" (click)="onCancel()">{{ 'COMMON.CANCEL' | translate }}</button>

    <button class="confirm-btn" type="button" [disabled]="!ticker.trim()" (click)="onContinue()">
      {{ 'PORTFOLIO.SELL_PROMPT.CONTINUE_BUTTON' | translate }}
    </button>
  </div>
</div>
