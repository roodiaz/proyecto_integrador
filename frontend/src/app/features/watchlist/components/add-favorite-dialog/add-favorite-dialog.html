<h2 mat-dialog-title>
    Agregar a Favoritos
</h2>

<mat-dialog-content>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>
            Buscar activo
        </mat-label>

        <input matInput [(ngModel)]="searchTerm" placeholder="Ej: AAPL, NVDA...">

    </mat-form-field>

    <div class="search-actions">

        <button mat-raised-button color="primary" (click)="add(searchTerm)" [disabled]="!searchTerm">
            Agregar Activo
        </button>

    </div>

    <div class="section-title">
        Activos Populares
    </div>

    <div class="asset-list">

        <div class="asset-item" *ngFor="let asset of popularAssets">

            <div class="asset-info">

                <div class="asset-symbol">
                    {{ asset.symbol }}
                </div>

                <div class="asset-name">
                    {{ asset.name }}
                </div>

            </div>

            <button mat-button color="primary" (click)="add(asset.symbol)">
                Agregar
            </button>

        </div>

    </div>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button mat-button mat-dialog-close>

        Cancelar

    </button>

</mat-dialog-actions>
