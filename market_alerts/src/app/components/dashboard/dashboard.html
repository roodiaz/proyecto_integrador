<div class="dashboard-container">
  <!-- Sidebar -->
  <aside class="sidebar-container" [class.sidebar-collapsed]="!showSidebar" [class.show-mobile]="showSidebar && isMobile">
    <app-sidebar></app-sidebar>
  </aside>

  <!-- Header -->
  <header class="app-header" [class.sidebar-collapsed]="!showSidebar">
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>
  </header>

  <!-- Content Wrapper -->
  <div class="content-wrapper" [class.sidebar-collapsed]="!showSidebar">
    <!-- Mobile Overlay -->
    <div class="overlay" [class.show]="showSidebar && isMobile" (click)="toggleSidebar()"></div>
    
    <!-- Main Content -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
