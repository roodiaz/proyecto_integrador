name: Generar release Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la release, por ejemplo 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar versión y preparar entorno
        working-directory: backend
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "La versión ingresada no es válida: $VERSION"
            exit 1
          fi

          cp .env.example .env
          mkdir -p "../release/v$VERSION"

      - name: Construir imagen de la API
        working-directory: backend
        run: |
          docker compose --env-file .env -f docker-compose.yml build investlab.api

      - name: Guardar imagen de la API
        working-directory: backend
        run: |
          docker save \
            -o "../release/v$VERSION/investlabapi_v$VERSION.tar" \
            investlabapi:latest

      - name: Construir imagen de Workers
        working-directory: backend
        run: |
          docker compose --env-file .env -f docker-compose.yml build investlab.workers

      - name: Guardar imagen de Workers
        working-directory: backend
        run: |
          docker save \
            -o "../release/v$VERSION/investlabworkers_v$VERSION.tar" \
            investlabworkers:latest

      - name: Construir imagen del Frontend
        working-directory: backend
        run: |
          docker compose --env-file .env -f docker-compose.yml build investlab.frontend

      - name: Guardar imagen del Frontend
        working-directory: backend
        run: |
          docker save \
            -o "../release/v$VERSION/investlabfrontend_v$VERSION.tar" \
            investlabfrontend:latest

      - name: Copiar archivos de configuración
        working-directory: backend
        run: |
          cp .env.example "../release/v$VERSION/"
          cp docker-compose.yml "../release/v$VERSION/"

          if [ -f docker-compose.override.yml ]; then
            cp docker-compose.override.yml "../release/v$VERSION/"
          fi

      - name: Publicar paquete descargable
        uses: actions/upload-artifact@v4
        with:
          name: investlab-release-v${{ inputs.version }}
          path: release/v${{ inputs.version }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
