<div class="landing-container">
  <!-- Sección de imagen (65% del ancho) -->
  <div #imageSection class="image-section">
    <!-- Navbar con Angular Material -->
    <mat-toolbar class="main-toolbar">
      <div class="toolbar-content">
        <a mat-raised-button 
           class="nav-button" 
           [class.active]="isActive('login')"
           (click)="setActive('login')"
           routerLink="login"
           routerLinkActive="active">
          Ingresar
        </a>
        <a mat-raised-button 
           class="nav-button" 
           [class.active]="isActive('registro')"
           (click)="setActive('registro')"
           routerLink="registro"
           routerLinkActive="active">
          Registrarse
        </a>
        <a mat-raised-button 
           class="nav-button" 
           [class.active]="isActive('nosotros')"
           (click)="setActive('nosotros')"
           routerLink="nosotros"
           routerLinkActive="active">
          Nosotros
        </a>
        <a mat-raised-button 
           class="nav-button" 
           [class.active]="isActive('contacto')"
           (click)="setActive('contacto')"
           routerLink="contacto"
           routerLinkActive="active">
          Contacto
        </a>
      </div>
    </mat-toolbar>
    <!-- La imagen se maneja desde el CSS -->
  </div>
  
  <!-- Sección de contenido (35% del ancho) -->
  <div class="content-section">
    <router-outlet></router-outlet>
    <mat-toolbar class="app-footer" color="primary">
      <span class="footer-text">© 2025 MarketAlerts. Todos los derechos reservados.</span>
    </mat-toolbar>
  </div>
</div>
