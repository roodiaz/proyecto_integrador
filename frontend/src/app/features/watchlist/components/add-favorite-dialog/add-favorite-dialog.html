<div class="modal-container">
  <div class="modal-header">
    <div>
      <h2>Agregar Activo</h2>
      <p class="modal-subtitle">Busca por símbolo o selecciona uno popular</p>
    </div>
    <button class="close-btn" type="button" mat-dialog-close>✕</button>
  </div>

  <div class="modal-body">

    <!-- Buscador -->
    <div class="search-wrap">
      <mat-icon class="search-icon">search</mat-icon>
      <input
        type="text"
        class="search-input"
        placeholder="Ej: AAPL, NVDA, TSLA..."
        [(ngModel)]="searchTerm">
      @if (searchTerm) {
        <button class="search-clear" type="button" (click)="searchTerm = ''">
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>

    <button class="btn-add-primary" type="button" (click)="add(searchTerm)" [disabled]="!searchTerm.trim()">
      <mat-icon>add</mat-icon>
      Agregar "{{ searchTerm || '...' }}"
    </button>

    <!-- Activos populares -->
    <div class="section-label-row">
      <p class="section-label">Activos Populares</p>
      <app-info-tooltip text="Son algunas de las acciones más conocidas del mercado estadounidense. Agregarlas a favoritos te permite seguir su precio desde la watchlist sin tener que buscarlas cada vez. No implica comprarlas." />
    </div>

    <div class="asset-list">
      @for (asset of popularAssets; track asset.symbol) {
        <div class="asset-item">
          <div class="asset-info">
            <div class="asset-logo">{{ asset.symbol.charAt(0) }}</div>
            <div class="asset-text">
              <span class="asset-symbol">{{ asset.symbol }}</span>
              <span class="asset-name">{{ asset.name }}</span>
            </div>
          </div>
          <button class="btn-add-row" type="button" (click)="add(asset.symbol)">
            <mat-icon>add</mat-icon>
            Agregar
          </button>
        </div>
      }
    </div>

  </div>

  <div class="modal-footer">
    <button class="cancel-btn" type="button" mat-dialog-close>Cancelar</button>
  </div>
</div>
